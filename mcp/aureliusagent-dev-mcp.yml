description: >-
  WunderCorp ships NO Model Context Protocol server for the Aurelius Agent, the Wundership MPP API or the
  Walton Capacity API. Searched 2026-09-19: POST tools/list to https://rpc.aureliusagent.dev/mcp,
  https://mpp.openmodel.sh/mcp and https://api.wundership.com/mcp all return 403 {"error":"Origin is not
  allowed."} (the origin's unknown-route shape); tools/list on the A2A endpoint returns JSON-RPC -32601;
  https://aureliusagent.dev/mcp is the SPA shell; no @wundercorp MCP package exists on npm; the wundercorp
  GitHub org publishes an awesome-mcp DIRECTORY of other people's servers but no server of its own.
  BuilderStudio is an MCP CLIENT ("bs mcp list / install / inspect") and AgentVM sells "MCP Sandboxes"
  (hosting), neither of which is a server for these APIs. The tool list below is therefore a DERIVED
  candidate that an MCP server could expose; nobody serves it, and no endpoint URL is recorded.
