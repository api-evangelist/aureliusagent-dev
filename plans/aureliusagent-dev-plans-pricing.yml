note: >-
  WunderCorp publishes no subscription tiers for these APIs; pricing is per call and machine-readable.
  Every price below was read from the provider's JSON product catalog and cross-checked against the
  OpenAPI's x-agent-price extension and the live 402 challenge (x-wundership-agent-price: 1.00 USD on
  /v1/plan). The human page https://wundercorp.co/agents/ lists the same five products under their LEGACY
  /mpp/* paths and adds "$0.50+ call pricing". The inference gateway has no price of its own: GET
  /v1/capabilities states gatewayApiKeyRequired false and the agent card states gatewaySurcharge false -
  the caller pays the upstream provider's MPP challenge, which the gateway passes through unchanged.
  Discovery (models, providers, capabilities, capacity offers and quotes) is free and unauthenticated.
  The 402 body also names a "humanFallback" - api.wundership.com/api-keys and /managed-apps/billing for
  persistent API keys, higher quotas and usage-based billing - but both URLs returned 403 anonymously on
  2026-09-19, so no key-based tier can be recorded. Payment rail: Stripe Shared Payment Token (card, Link)
  via MPP; the capacity marketplace reports paymentNetwork tempo-testnet.
