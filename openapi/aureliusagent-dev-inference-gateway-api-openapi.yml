  /v1/chat/completions:
    post:
      tags:
      - Inference Gateway
      operationId: postMppChatCompletions
      summary: Create a chat completion
      description: Routes the request to a supported MPP provider. Select the provider with X-OpenModel-Provider, a top-level provider field, or a provider-prefixed model ID. The upstream HTTP 402 challenge and payment receipt are passed through.
      parameters:
      - required: false
        schema:
          type: string
        description: Provider key such as openai, anthropic, gemini, openrouter, deepseek, groq, mistral, perplexity, grok, fal, replicate, stability-ai, suno, deepgram, or mathpix.
        name: X-OpenModel-Provider
        in: header
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
        '200':
          description: Upstream provider response
        '202':
          description: Upstream asynchronous operation accepted
        '400':
          description: Unknown provider or invalid gateway request
        '402':
          description: Upstream MPP payment required
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Upstream MPP payment challenge.
        '502':
          description: Upstream MPP provider unavailable
        '503':
          description: Gateway or provider route disabled
      x-payment-mode: upstream_mpp_challenge_passthrough
      x-gateway-api-key-required: false
