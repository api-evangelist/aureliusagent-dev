      - DELETE
      - HEAD
      x-payment-mode: upstream_mpp_challenge_passthrough
      x-operation-id-source: normalized
      x-operation-id-original: relayMppProviderRequest
components:
  securitySchemes:
    mppPayment:
      description: MPP payment authorization returned after satisfying the HTTP 402 challenge.
      scheme: Payment
      type: http
