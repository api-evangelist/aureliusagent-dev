description: >-
  First-party WunderCorp packages that touch the surfaces this repo profiles: the Aurelius Agent container
  image (the only distribution of the A2A agent itself), the ArgentShell MPP test harness (the provider's
  own client tooling for the Wundership 402 flow), the OpenModel gateway runtime and its authoring
  contract (the MPP inference gateway is "OpenModel MPP Gateway"), and the headless BuilderStudio CLI that
  consumes Aurelius. Versions and dates are read from the registry metadata endpoints on 2026-09-19. All
  are published by the npm user "builderstudio" under the @wundercorp scope or by the wundercorp GitHub
  org. NONE is a client SDK for the Wundership or Walton APIs: no SDKs pointer is emitted. Searched and
  absent: PyPI (aurelius-agent, builderstudio, wundercorp, openmodel-mpp, hermes-tempo-pay all 404),
  Maven Central, NuGet, RubyGems, Packagist, crates.io and pkg.go.dev (no @wundercorp / wundercorp
  artifacts). The wundercorp GitHub org (33 public repos) publishes no .proto, no WSDL and no SDK repo;
  hermes-tempo-pay (a Hermes Agent plugin for payment-aware HTTP 402/MPP requests, Python) exists only as
  a GitHub repo with no registry release.
