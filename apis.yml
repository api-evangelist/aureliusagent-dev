apis:
- name: Aurelius Agent A2A API
  description: >-
    Agent-to-Agent (A2A 0.3.0) JSON-RPC surface for Aurelius Agent, WunderCorp's strategic planning and
    orchestration agent for BuilderStudio. Three published skills (strategic-planning, implementation-coordination,
    build-smoke-release-flow), text/plain and application/json modes, no streaming or push notifications,
    anonymous access (securitySchemes is empty). The card is served on the primary domain at the canonical
    /.well-known/agent-card.json and the legacy /.well-known/agent.json, and on rpc.aureliusagent.dev,
    mpp.openmodel.sh, api.wundership.com and api.walton.bot.
  image: https://aureliusagent.dev/assets/aurelius-logo.png
  humanURL: https://aureliusagent.dev/
  baseURL: https://rpc.aureliusagent.dev/a2a
