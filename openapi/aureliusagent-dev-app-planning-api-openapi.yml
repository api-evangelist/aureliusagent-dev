components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        fallback:
          type: string
      additionalProperties: true
    PaymentRequired:
      type: object
      required:
      - error
      - status
      - resource
      - amount
      - payment
      properties:
        error:
          example: payment_required
          type: string
        type:
          example: machine_payment_required
          type: string
        status:
          example: 402
          type: integer
        protocols:
          items:
            type: string
          type: array
        provider:
          example: wundership
          type: string
        resource:
          format: uri
          type: string
        product:
          additionalProperties: true
          type: object
        amount:
          additionalProperties: true
          type: object
        payment:
          additionalProperties: true
          type: object
        requestId:
          type: string
  securitySchemes:
    mppPayment:
      description: MPP payment authorization returned after satisfying the HTTP 402 challenge.
      scheme: Payment
      type: http
