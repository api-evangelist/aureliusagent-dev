- openapi/aureliusagent-dev-wundership-mpp-api-openapi.yml (responses 200/202/400/402/500-class, components.schemas.PaymentRequired and ErrorResponse)
- openapi/aureliusagent-dev-walton-capacity-mpp-api-openapi.yml (responses 200/201/402)
- live unpaid POST https://mpp.openmodel.sh/v1/plan and /v1/chat/completions (2026-09-19)
