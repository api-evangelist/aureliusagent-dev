description: >-
  WunderCorp publishes no human changelog or release notes for the Aurelius Agent, the Wundership MPP API
  or the Walton Capacity API (no /changelog, /releases or GitHub Releases page; the wundercorp org has no
  aurelius-agent source repo). What IS published and dated is the container registry: every runtime
  version is a ghcr.io tag with a build timestamp in its image config, and the agent card and OpenAPI carry
  versions of their own. The entries below are read from those machine sources, so the scheme is honest
  but coarse - a version and a date, with no per-release notes. The API's date-based version and the
  deprecation of the /mpp/* generation are the only API-level changes evidenced.
