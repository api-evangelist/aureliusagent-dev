aid: aureliusagent-dev
name: WunderCorp
description: >-
  WunderCorp, Inc. is the agentic-software company behind BuilderStudio, a local-first agentic coding
  IDE, and a family of agent-payable APIs. Aurelius Agent (aureliusagent.dev) is its A2A orchestration
  agent: a containerized runtime that plans complex software work, delegates implementation lanes to
  Hermes Agent workers and reviews the evidence, published with a conformant A2A 0.3.0 agent card and a
  JSON-RPC endpoint at rpc.aureliusagent.dev/a2a. The same host serves the Wundership MPP API, an
  OpenAPI 3.1 contract for machine-paid app planning, BuilderStudio previews, image generation, commerce
  listings and a unified inference gateway that passes HTTP 402 Machine Payments Protocol challenges
  through from upstream model providers, plus the Walton Capacity MPP API for buying GPU, inference,
  edge-compute and workspace capacity. Discovery is machine-first: /.well-known/mpp.json, llms.txt,
  agent-products.json and machine-payments.json on every API host.
url: https://raw.githubusercontent.com/api-evangelist/aureliusagent-dev/refs/heads/main/apis.yml
image: https://aureliusagent.dev/assets/aurelius-logo.png
