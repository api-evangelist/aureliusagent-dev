  /providers/{provider}/{upstreamPath}:
    post:
      tags:
      - Inference Gateway
      operationId: relayMppProviderRequest
      summary: Relay a request to a whitelisted MPP provider
      description: Preserves the provider-specific upstream path, request body, MPP Authorization credential, HTTP 402 challenge, and payment receipt. upstreamPath may contain multiple path segments.
      parameters:
      - name: provider
        schema:
          type: string
        required: true
        in: path
      - name: upstreamPath
        schema:
          type: string
        required: true
        in: path
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: false
      responses:
        '200':
          description: Upstream provider response
        '202':
          description: Upstream asynchronous operation accepted
